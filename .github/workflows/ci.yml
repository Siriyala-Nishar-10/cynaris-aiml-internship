# CI/CD: lint -> test -> build image -> push to GitHub Container Registry.
# This file must live at the REPOSITORY ROOT (.github/workflows/ci.yml).
# If the project sits in a sub-folder, set APP_DIR to that folder name.
name: ci

on:
  push:
    branches: [main, "feat/**"]
    paths: ["cynaris-w8d1/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["cynaris-w8d1/**", ".github/workflows/ci.yml"]

env:
  APP_DIR: cynaris-w8d1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
        working-directory: ${{ env.APP_DIR }}

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: ${{ env.APP_DIR }}
      - run: python -m pytest -q
        working-directory: ${{ env.APP_DIR }}

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags (lower-cased automatically)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-rag-api
          tags: |
            type=ref,event=branch
            type=sha
      - name: Build (and push on push events)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
